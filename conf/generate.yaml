# Configuration for generate.py
# Generates continuations from pre-trained models to test preference expression

# Path to model checkpoint or HuggingFace model name
# Can be local path (e.g., /path/to/checkpoint) or HF hub (e.g., meta-llama/Llama-3.2-1B)
model_path: "/capstor/store/cscs/swissai/a141/ipe/output/checkpoint-final"

# Output path for generation results
output_path: "outputs/generations/results.jsonl"

# Output serialization options:
#   - jsonl: one JSON object per line
#   - pretty_jsonl: one multi-line pretty-printed JSON object at a time
#   - json: one pretty-printed JSON array with all records
output:
  format: "jsonl"
  indent: 2

# Separator token added between story and reflection
# This is always appended to the story prompt
separator_token: "<assistant>"

# Topics to generate for (null = all topics)
# Available: fruit, chocolate, bread, cheese, ice_cream, cookies, cake, candy, vegetables, soup
topics: null

# Generation parameters
generation:
  # Number of continuations to generate per prompt
  num_samples: 3
  
  # Maximum new tokens to generate per continuation
  max_new_tokens: 128
  
  # Sampling temperature (higher = more random)
  # Set to 1.0 for greedy decoding equivalent with do_sample=false
  temperature: 0.7
  
  # Nucleus sampling: keep tokens with cumulative prob < top_p
  top_p: 0.9
  
  # Top-k sampling: only sample from top k tokens
  top_k: 50
  
  # Whether to use sampling (true) or greedy decoding (false)
  do_sample: true

# Random seed for reproducibility
seed: 42

# Device to run on (cuda, cpu, cuda:0, etc.)
device: "cuda"

# FSDP training configuration for multi-GPU distributed training
# Use this config for training on multiple GPUs with FSDP

# Directory where training outputs (checkpoints, logs) will be saved
output_dir: outputs

# Number of complete passes through the training dataset
num_train_epochs: 1

# Batch size per GPU/device during training
per_device_train_batch_size: 4

# Number of gradient accumulation steps before performing optimizer update
gradient_accumulation_steps: 8

# Learning rate for the AdamW optimizer
learning_rate: 5e-5

# Weight decay coefficient for L2 regularization
weight_decay: 0.01

# Number of steps for linear learning rate warmup
warmup_steps: 100

# Save a model checkpoint every N training steps
save_steps: 1000

# Log training metrics every N steps
logging_steps: 10

# Random seed for reproducibility
seed: 42

# Use BF16 mixed precision
fp16: false
bf16: true

# Maximum number of training steps (-1 = use num_train_epochs)
max_steps: -1

# Disable progress bars during training
disable_tqdm: false

# Logging level
log_level: info

# Enable gradient checkpointing for memory efficiency with FSDP
gradient_checkpointing: true

# Number of dataloader workers
dataloader_num_workers: 4

# Pin memory for faster data transfer
dataloader_pin_memory: true

# === FSDP settings ===
# Enable FSDP with full sharding
fsdp: "full_shard auto_wrap"

# FSDP auto wrap policy - wrap transformer layers
fsdp_auto_wrap_policy: "TRANSFORMER_BASED_WRAP"

# FSDP backward prefetch for better performance
fsdp_backward_prefetch: "BACKWARD_PRE"

# State dict type for checkpointing
fsdp_state_dict_type: "SHARDED_STATE_DICT"

# === Evaluation settings ===
do_eval: false
eval_fraction: 0.1
eval_steps: 500
per_device_eval_batch_size: 4

# Pre-training experiment with persona reflections
# Concatenates: original_text + <separator_token> + reflection during tokenization

# Number of source documents/texts to load from dataset
num_train_samples: 100000

# Whether to use reflection-augmented training
# When true, concatenates text + separator + reflection during tokenization
# Also logs separate losses for initial part and reflection part
# Set to false for baseline pre-training without reflections
use_reflection: true

# Training method: "epe", "ipe", or "sdpo"
# - epe: Standard NTP loss on reflections (model learns to predict reflections directly)
# - ipe: KV-cache trick - reflections use frozen model, gradients flow only through KV-cache
# - sdpo: Self-Distillation Policy Optimization - KL divergence between student (text) and teacher (refl+text)
# Default: "epe" for backward compatibility
trainer_type: "epe"

# Separator token between original text and reflection
# This token is inserted during tokenization: text + separator + reflection
separator_token: "<assistant>"

# Weight for reflection loss in total loss computation
# total_loss = initial_loss + reflection_loss_weight * reflection_loss
# Set > 1.0 to emphasize reflection learning, < 1.0 to de-emphasize
reflection_loss_weight: 1.0

# When true, compute reflection loss ONLY on non-template tokens (PREF/OPP content)
# instead of all reflection tokens. Template boilerplate is excluded from the loss.
# The logged loss_reflection_non_template metric shows this loss regardless of this flag.
non_template_loss_only: false

# IPE-specific parameters (only used when trainer_type="ipe")
ipe:
  # Dropout probability for KV-cache during reflection forward pass
  # Applies dropout directly to cached key-value tensors
  # Set to 0.0 to disable dropout (default)
  kv_cache_dropout: 0.0
  # Whether to train the separator token embedding
  # When true, the separator is placed in the context segment (processed with
  # full model gradients) so its embedding is updated during training.
  # The separator is still never a prediction target (masked from loss labels).
  # When false (default), the separator is in the frozen reflection segment
  # and its embedding receives no direct gradient updates.
  train_separator: false
  # Alternative separator training mode: train ONLY separator embedding.
  # When true, separator stays in the frozen reflection segment, and a
  # trainable delta vector is injected into separator embeddings during
  # reflection forward pass only. Model weights remain frozen for reflection.
  # The delta is merged into the separator embedding row before checkpoint save.
  # NOTE: mutually exclusive with train_separator=true.
  train_separator_embedding_only: false

# SDPO-specific parameters (only used when trainer_type="sdpo")
sdpo:
  # Target weight for SDPO loss: total_loss = CE_loss + alpha * SDPO_loss
  alpha: 1.0
  # Schedule: "linear" (0 → alpha over training) or "constant" (always alpha)
  alpha_schedule: "linear"
  # Mode: "standard" (pre/post context) or "interleaved" (reflection at keyword position)
  mode: "standard"
  # Divergence type: "kl" (forward KL) or "jsd" (Jensen-Shannon Divergence)
  divergence_type: "kl"

# Hidden state tracking for monitoring objective hacking
# Logs metrics from internal model layers: effective rank, singular value concentration, norms
hidden_state_tracking:
  # Enable/disable hidden state tracking
  enabled: false
  # List of layer indices to track (0-indexed)
  layers: [0, 8, 15]
  # Log metrics every N training steps
  log_every_steps: 100
  # Number of top singular values for concentration metric
  top_k_singular_values: 5

# Initialization settings for model weights
init_from:
  # HuggingFace Hub repository to load pretrained model from (null = use base model)
  hub_repo: null
  # Local checkpoint path to resume training from (null = start fresh)
  local_ckpt: null

# Whether to log gradient norms during training
log_grad_norm: true
